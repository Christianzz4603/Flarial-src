name: Extract Flarial Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Reconstruct ZIP
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          parts=(Flarial_src.zip.part-*)

          if [ "${#parts[@]}" -eq 0 ]; then
            echo "::error::No ZIP parts found in repository root."
            exit 1
          fi

          printf '%s\n' "${parts[@]}" | sort -V > /tmp/part-list.txt

          while IFS= read -r part; do
            cat "$part" >> /tmp/Flarial_src.zip
          done < /tmp/part-list.txt

          echo "Reconstructed ZIP:"
          ls -lh /tmp/Flarial_src.zip

          unzip -tq /tmp/Flarial_src.zip

      - name: Extract source files
        run: |
          set -euo pipefail

          mkdir -p /tmp/flarial-extracted
          unzip -oq /tmp/Flarial_src.zip -d /tmp/flarial-extracted

          # Merge extracted files into the repository root.
          cp -a /tmp/flarial-extracted/. .

          # Remove temporary uploaded chunks and the reconstructed archive.
          rm -f Flarial_src.zip.part-*

      - name: Commit extracted source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Flarial source archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
